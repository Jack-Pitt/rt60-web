<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NVC RT60">
  <!-- Placeholder NVC·RT60 wordmark in NVC teal. Replace with the
       SharePoint NVC mark + RT60 lockup once the official SVG is in
       the project folder. -->
  <rect width="512" height="512" rx="96" fill="#0e1014"/>
  <!-- Top half: NVC -->
  <text x="256" y="220"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800" font-size="120" letter-spacing="-4"
    text-anchor="middle" fill="#00A48B">NVC</text>
  <!-- Hairline rule between the wordmarks (NVC ruled-style nod). -->
  <rect x="116" y="252" width="280" height="3" fill="#00A48B"/>
  <!-- Bottom half: RT60 -->
  <text x="256" y="370"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700" font-size="100" letter-spacing="2"
    text-anchor="middle" fill="#f4f4f5">RT60</text>
</svg>
