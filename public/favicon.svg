<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RT60 by NVC">
  <!-- App icon — translates Header G to a square format. Same dark
       canvas as the app header so the icon feels continuous with what
       the user sees on launch; same SF Pro Display weight contrast
       (Black RT60 + Thin by, with NVC in heavy teal). -->

  <!-- Dark canvas, rounded square (iOS will apply its own corner mask
       on top). -->
  <rect width="512" height="512" rx="96" fill="#0e1014"/>

  <!-- "RT60" — heavy Black weight, tight letter-spacing, large. -->
  <text x="256" y="270" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
    font-weight="900" font-size="170" fill="#ffffff" letter-spacing="-6">RT60</text>

  <!-- "by NVC" — Display Thin contrast against the Black above. NVC
       in heavy teal, matching the in-app wordmark. -->
  <text x="256" y="370" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
    font-weight="200" font-size="64" fill="#9aa1ad" letter-spacing="-1">by <tspan font-weight="800" fill="#00A48B" letter-spacing="-0.5">NVC</tspan></text>
</svg>
