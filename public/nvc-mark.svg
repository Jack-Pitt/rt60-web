<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" role="img" aria-label="NVC — Noise Vibration Consulting">
  <!-- Compact NVC mark for the app header. Teal on transparent so it
       reads on the dark theme. Recreated from the NVC PDF lockup
       (white-on-teal version) — chevrons evoke radiating sound waves
       on either side of the wordmark. -->

  <!-- Left chevrons (pointing outward, three nested levels). -->
  <g fill="none" stroke="#00A48B" stroke-width="6" stroke-linecap="square">
    <polyline points="74,40 50,55 74,70" />
    <polyline points="58,42 38,55 58,68" />
    <polyline points="42,44 26,55 42,66" />
  </g>

  <!-- NVC wordmark. Heavy weight to match the PDF's bold sans. -->
  <text x="160" y="74"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900" font-size="58" letter-spacing="-1"
    text-anchor="middle" fill="#00A48B">NVC</text>

  <!-- Right chevrons (mirrored). -->
  <g fill="none" stroke="#00A48B" stroke-width="6" stroke-linecap="square">
    <polyline points="246,40 270,55 246,70" />
    <polyline points="262,42 282,55 262,68" />
    <polyline points="278,44 294,55 278,66" />
  </g>
</svg>
