<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 140" role="img" aria-label="Header concept B — stacked monogram">
  <!-- Header B: stacked monogram.
       RT60 large on top, "BY NVC" in tracked-out small caps beneath.
       Compact and logo-like. NVC in teal as the brand anchor. -->
  <rect width="750" height="140" fill="#0e1014"/>

  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
    font-weight="900" font-size="58" fill="#f4f4f5" letter-spacing="-1.5">RT60</text>

  <text x="40" y="106" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
    font-weight="600" font-size="18" fill="#9aa1ad" letter-spacing="6">BY <tspan fill="#00A48B" font-weight="900">NVC</tspan></text>

  <g transform="translate(680, 56)" stroke="#9aa1ad" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 14v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h8"/>
    <polyline points="18 2 26 2 26 10"/>
    <line x1="11" y1="15" x2="26" y2="2"/>
  </g>

  <line x1="0" y1="138" x2="750" y2="138" stroke="rgba(221,221,221,0.20)" stroke-width="1"/>
</svg>
