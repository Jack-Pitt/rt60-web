<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 140" role="img" aria-label="Header concept C — masthead with rule">
  <!-- Header C: magazine-masthead style.
       RT60 large + thin teal hairline + "BY NVC" small-caps tracked below.
       Subtle, refined, NVC ruled-style consistent with the table chrome. -->
  <rect width="750" height="140" fill="#0e1014"/>

  <text x="40" y="60" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
    font-weight="900" font-size="52" fill="#f4f4f5" letter-spacing="-1.5">RT60</text>

  <!-- Thin teal rule beneath the wordmark — echoes the NVC table top rule. -->
  <line x1="40" y1="80" x2="220" y2="80" stroke="#00A48B" stroke-width="2"/>

  <text x="40" y="108" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
    font-weight="600" font-size="14" fill="#9aa1ad" letter-spacing="7">BY  <tspan fill="#00A48B" font-weight="900">NVC</tspan></text>

  <g transform="translate(680, 56)" stroke="#9aa1ad" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 14v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h8"/>
    <polyline points="18 2 26 2 26 10"/>
    <line x1="11" y1="15" x2="26" y2="2"/>
  </g>

  <line x1="0" y1="138" x2="750" y2="138" stroke="rgba(221,221,221,0.20)" stroke-width="1"/>
</svg>
