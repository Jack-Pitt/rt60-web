       Watch-launch move. The period adds confidence and typographic
       personality. Beneath, a hairline rule and tiny tracked "by NVC"
       extends a quiet brand byline below the statement. -->
  <rect width="750" height="140" fill="#0e1014"/>

  <text x="40" y="78"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
    font-weight="800" font-size="60" fill="#f4f4f5" letter-spacing="-2">RT60<tspan fill="#00A48B">.</tspan></text>

  <text x="40" y="108"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
    font-weight="500" font-size="13" fill="#9aa1ad" letter-spacing="4">By  <tspan fill="#00A48B" font-weight="800">NVC</tspan></text>

  <g transform="translate(680, 56)" stroke="#9aa1ad" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 14v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h8"/>
