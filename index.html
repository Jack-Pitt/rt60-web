<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- iOS uses apple-touch-icon for the home-screen shortcut — must be
         a square PNG. 180x180 is the modern size; iOS resamples for
         smaller densities. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <!-- viewport-fit=cover lets the app paint into iPhone safe areas. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Status bar / splash colours when installed to home screen on iOS.
         Background matches our --color-bg token; black-translucent below
         keeps the iOS status bar overlay see-through. -->
    <meta name="theme-color" content="#0e1014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RT60" />
    <title>RT60 Measurement</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
